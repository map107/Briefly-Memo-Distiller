kind = "web"
previewPath = "/"
title = "Legal Memo Simplifier"
version = "1.0.0"
id = "artifacts/memo-simplifier"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25603

[services.development]
run = "pnpm --filter @workspace/memo-simplifier run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/memo-simplifier", "run", "build" ]
publicDir = "artifacts/memo-simplifier/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25603"
BASE_PATH = "/"
